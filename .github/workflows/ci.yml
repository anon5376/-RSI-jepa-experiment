name: CPU JEPA smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Reproducible smoke experiment
        run: python -m jepa_lab --config configs/smoke.json --output reports/ci-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-smoke-metrics
          path: reports/ci-smoke.json
          retention-days: 7
